$kind: http-request
description: Triggers instant Tier 1 emergency triage with poison hotlines and first aid rules.
url: "{{baseUrl}}/api/v1/health-chat"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "pet_id": "{{pet_id}}",
      "message": "My dog ate dark chocolate baker squares about 20 minutes ago!"
    }
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
order: 2000
