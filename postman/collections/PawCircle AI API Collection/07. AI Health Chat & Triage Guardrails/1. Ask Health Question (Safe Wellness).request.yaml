$kind: http-request
url: "{{baseUrl}}/api/v1/health-chat"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "pet_id": "{{pet_id}}",
      "message": "What is the best grooming brush for a golden retriever double coat?"
    }
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
order: 1000
